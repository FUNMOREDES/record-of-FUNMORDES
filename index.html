// ---------- helpers ----------
function msToStr(ms){
  if(!Number.isInteger(ms)||ms<0) return '--:--.---';
  const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000), mm=ms%1000;
  const p=(n,l)=>String(n).padStart(l,'0');
  return `${p(m,2)}:${p(s,2)}.${p(mm,3)}`;
}
function parseTimeStr(str){
  const m = str.trim().match(/^(\d{1,3}):([0-5]\d)\.(\d{1,3})$/);
  if(!m) throw new Error('Định dạng phải là MM:SS.mmm, ví dụ 01:25.350');
  const minutes=+m[1], seconds=+m[2], millis=+m[3].padEnd(3,'0');
  const total = minutes*60000+seconds*1000+millis;
  if(total<=0 || total>30*60000) throw new Error('Thời gian không hợp lệ.');
  return total;
}
function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, type='ok'){
  const el=document.createElement('div');
  el.className='fixed bottom-5 left-1/2 -translate-x-1/2 sm:left-auto sm:right-5 sm:translate-x-0 z-[100] px-4 py-3 rounded-xl text-sm font-medium shadow-lg max-w-[90vw]';
  el.style.background = type==='ok' ? 'var(--ok)' : 'var(--err)';
  el.style.color='#0a0a0a';
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 3000);
}
function stars(n){ return '★'.repeat(n) + '☆'.repeat(7-n); }

// ---------- Storage ----------
const MAX_UPLOAD_MB = 10;
const ALLOWED_TYPES = ['image/png','image/jpeg','image/jpg','image/webp'];
async function uploadImage(bucket, file, pathPrefix){
  if(!ALLOWED_TYPES.includes(file.type)) throw new Error('Chỉ chấp nhận ảnh PNG, JPG hoặc WEBP.');
  if(file.size > MAX_UPLOAD_MB*1024*1024) throw new Error(`Ảnh vượt quá ${MAX_UPLOAD_MB}MB.`);
  const ext = file.name.split('.').pop();
  const path = `${pathPrefix}/${crypto.randomUUID()}.${ext}`;
  const { error } = await sb.storage.from(bucket).upload(path, file, { upsert:false });
  if(error) throw new Error('Lỗi tải ảnh lên: '+error.message);
  if(bucket==='evidence'){
    const { data, error:e2 } = await sb.storage.from(bucket).createSignedUrl(path, 60*60*24*7);
    if(e2) throw e2;
    return { path, url: data.signedUrl };
  }
  const { data } = sb.storage.from(bucket).getPublicUrl(path);
  return { path, url: data.publicUrl };
}
function filePreview(inputEl, imgEl){
  inputEl.addEventListener('change', ()=>{
    const f = inputEl.files[0];
    if(!f) return imgEl.classList.add('hidden');
    imgEl.src = URL.createObjectURL(f);
    imgEl.classList.remove('hidden');
  });
}

// ---------- router ----------
const routes = {};
function route(pattern, handler){ routes[pattern]=handler; }
function navigate(hash){ window.location.hash = hash; }
async function resolveRoute(){
  const hash = window.location.hash.slice(1) || '/';
  for(const pattern in routes){
    const keys=[]; const re = new RegExp('^'+pattern.replace(/:[^/]+/g,m=>{keys.push(m.slice(1));return '([^/]+)';})+'$');
    const m = hash.match(re);
    if(m){
      const params={}; keys.forEach((k,i)=>params[k]=decodeURIComponent(m[i+1]));
      app.innerHTML = '<div class="p-10 text-center text-[--tx2]">Đang tải...</div>';
      try{ await routes[pattern](params); }
      catch(e){ app.innerHTML = `<div class="p-10 text-center text-[--err]">Lỗi: ${esc(e.message)}</div>`; }
      return;
    }
  }
  render404();
}
window.addEventListener('hashchange', resolveRoute);

// ---------- AUTH ----------
async function loadSession(){
  const { data:{ session } } = await sb.auth.getSession();
  currentUser = session?.user || null;
  currentProfile = null;
  if(currentUser){
    const { data } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
    currentProfile = data;
  }
}
async function doLogout(){ await sb.auth.signOut(); await loadSession(); navigate('/'); }

    <h1 class="text-xl md:text-2xl font-extrabold mb-6">Đăng nhập</h1>

      <div><label class="text-sm text-[--tx2]">Username</label><input required name="username" minlength="3" maxlength="32" class="w-full mt-1"></div>

      <button class="btn-p w-full" type="submit">Tạo tài khoản</button>

  document.getElementById('f-reg').onsubmit = async (e)=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const username = String(fd.get('username')||'').trim().toLowerCase();

    const { data, error } = await sb.auth.signUp({ email: username+'@login.clan.local', password:fd.get('password'), options:{ data:{ username } } });
    if(error) return toast(error.message,'err');
    const { error:perr } = await sb.from('profiles').insert({
      id: data.user.id, username: fd.get('username'), ingame_name: fd.get('ingame_name')
    });

    navigate('/login');
  };

    (ranks||[]).forEach(r=> bestByMap[r.map_id]=r);
  }

  const filters=[null,2,3,4,5,6,7];
  layout(`
    <div class="flex flex-wrap gap-2 mb-4 md:mb-6 overflow-x-auto pb-1">
      ${filters.map(f=>`<a onclick="navigate('${f?'/maps/difficulty/'+f:'/maps'}')"
        class="btn-s text-xs md:text-sm shrink-0" style="${(difficulty===f)?'background:var(--blue);color:#0a0a0a;border-color:var(--blue)':''}">
        ${f?f+'⭐':'Tất cả'}</a>`).join('')}
    </div>
    <div class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 md:gap-5">
      ${maps.length ? maps.map(m=>mapCard(m,bestByMap[m.id])).join('') : emptyState('Không có map nào ở mức độ khó này.')}
    </div>`);
}
function mapCard(m,best){
  return `<div class="card overflow-hidden cursor-pointer group" onclick="navigate('/map/${esc(m.slug)}')">
    <div class="aspect-video overflow-hidden relative" style="background:var(--bg2)">
      ${m.thumbnail_url?`<img src="${esc(m.thumbnail_url)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">`:`<div class="w-full h-full flex items-center justify-center text-3xl md:text-4xl">🏁</div>`}
      <span class="badge absolute top-1.5 left-1.5 md:top-2 md:left-2" style="background:rgba(0,0,0,.7);color:var(--gold)">${stars(m.difficulty)}</span>
    </div>
    <div class="p-2.5 md:p-4">
      <div class="font-bold text-sm md:text-base mb-1 truncate">${esc(m.name)}</div>
      <div class="text-xs md:text-sm text-[--tx2] truncate">${best? `${esc(best.profiles.ingame_name)} · <span class="font-mono" style="color:var(--gold)">${msToStr(best.time_ms)}</span>` : 'Chưa có kỷ lục'}</div>
    </div>
  </div>`;
}

// ---------- MAP DETAIL ----------
route('/map/:slug', async (p)=>{
  const { data: map, error } = await sb.from('maps').select('*').eq('slug',p.slug).single();
  if(error || !map) return render404();
  const { data: ranks } = await sb.from('map_rankings').select('rank,time_ms,profiles(username,ingame_name,avatar_url)').eq('map_id',map.id).order('rank').limit(50);
  const top3 = (ranks||[]).slice(0,3);
  layout(`
    <div class="card p-5 md:p-8 mb-5 md:mb-8">
      <div class="flex flex-col md:flex-row md:justify-between md:items-start gap-4">
        <div class="min-w-0">
          <div class="mb-2 text-sm" style="color:var(--gold)">${stars(map.difficulty)}</div>
          <h1 class="text-xl md:text-3xl font-extrabold">${esc(map.name)}</h1>
          <p class="text-sm md:text-base text-[--tx2] mt-2 max-w-xl">${esc(map.description||'')}</p>
        </div>
        ${currentUser?`<a onclick="navigate('/submit-record')" class="btn-p text-sm shrink-0">Gửi REC</a>`:`<a onclick="navigate('/login')" class="btn-s text-sm shrink-0">Đăng nhập</a>`}
      </div>
    </div>
    ${top3.length? `<div class="podium-grid grid grid-cols-3 gap-3 md:gap-4 mb-5 md:mb-8">${top3.map((r,i)=>podium(r,i+1)).join('')}</div>`:''}
    <div class="card overflow-hidden">
      <table class="resp-table w-full text-sm">
        <thead><tr class="text-left text-[--tx2] border-b" style="border-color:var(--bd)">
          <th class="p-3">Hạng</th><th class="p-3">Thành viên</th><th class="p-3">Thời gian</th>
        </tr></thead>
        <tbody>
          ${(ranks||[]).map(r=>`<tr class="border-b" style="border-color:var(--bd)">
            <td class="p-3 font-bold" data-label="Hạng">${r.rank<=3?['🥇','🥈','🥉'][r.rank-1]:r.rank}</td>
            <td class="p-3" data-label="Thành viên">${esc(r.profiles.ingame_name)}</td>
            <td class="p-3 font-mono" data-label="Thời gian" style="color:var(--gold)">${msToStr(r.time_ms)}</td>
          </tr>`).join('') || `<tr><td class="p-6 text-center text-[--tx2]" colspan="3">Chưa có kỷ lục nào được duyệt cho map này.</td></tr>`}
        </tbody>
      </table>
    </div>`);
});
function podium(r,pos){
  const medal=['🥇','🥈','🥉'][pos-1];
  return `<div class="card p-3 md:p-5 text-center">
    <div class="text-2xl md:text-3xl mb-1">${medal}</div>
    <div class="font-bold text-sm md:text-base truncate">${esc(r.profiles.ingame_name)}</div>
    <div class="font-mono text-xs md:text-sm" style="color:var(--gold)">${msToStr(r.time_ms)}</div>
  </div>`;
}

// ---------- SUBMIT ----------
route('/submit-record', async ()=>{
  if(!currentUser){ toast('Vui lòng đăng nhập trước.','err'); return navigate('/login'); }
  const { data: maps } = await sb.from('maps').select('id,name,difficulty').eq('is_active',true).order('name');
  layout(`
    <div class="max-w-lg mx-auto card p-5 md:p-8">
      <h1 class="text-xl md:text-2xl font-extrabold mb-1">Gửi kỷ lục</h1>
      <p class="text-sm text-[--tx2] mb-6">Gửi với tư cách: <b>${esc(currentProfile?.ingame_name)}</b></p>
      <form id="f-rec" class="space-y-4">
        <div><label class="text-sm text-[--tx2]">Map</label>
          <select required name="map_id" class="w-full mt-1">
            <option value="">-- Chọn map --</option>
            ${maps.map(m=>`<option value="${m.id}">${esc(m.name)} (${m.difficulty}⭐)</option>`).join('')}
          </select>
        </div>
        <div><label class="text-sm text-[--tx2]">Thời gian (MM:SS.mmm)</label>
          <input required name="time_str" placeholder="01:25.350" class="w-full mt-1 font-mono" inputmode="numeric">
        </div>
        <div><label class="text-sm text-[--tx2]">Ảnh bằng chứng (tối đa ${MAX_UPLOAD_MB}MB)</label>
          <input required type="file" name="evidence_file" id="evidence_file" accept="image/png,image/jpeg,image/webp" class="w-full mt-1 text-sm">
          <img id="evidence_preview" class="hidden mt-2 max-h-48 rounded-lg border" style="border-color:var(--bd)">
        </div>
        <div><label class="text-sm text-[--tx2]">Ghi chú (không bắt buộc)</label>
          <textarea name="note" maxlength="500" class="w-full mt-1" rows="2"></textarea>
        </div>
        <label class="flex items-start gap-2 text-sm text-[--tx2]">
          <input required type="checkbox" name="confirm" class="mt-1 shrink-0">
          <span>Tôi xác nhận thời gian và bằng chứng cung cấp là chính xác.</span>
        </label>
        <button class="btn-p w-full" type="submit">Gửi kỷ lục</button>
      </form>
    </div>`);
  filePreview(document.getElementById('evidence_file'), document.getElementById('evidence_preview'));
  document.getElementById('f-rec').onsubmit = async (e)=>{
    e.preventDefault();
    const btn=e.target.querySelector('button'); btn.disabled=true;
    try{
      const fd = new FormData(e.target);
      const time_ms = parseTimeStr(fd.get('time_str'));
      const file = fd.get('evidence_file');
      if(!file || !file.size) throw new Error('Vui lòng chọn ảnh bằng chứng.');
      btn.textContent='Đang tải ảnh...';
      const { path } = await uploadImage('evidence', file, currentUser.id);
      btn.textContent='Đang gửi...';
      const { error } = await sb.from('records').insert({
        user_id: currentUser.id,
        map_id: fd.get('map_id'),
        time_ms,
        evidence_url: path,
        note: fd.get('note') || null,
        status: 'pending'
      });
      if(error) throw error;
      toast('Gửi kỷ lục thành công! Đang chờ duyệt.');
      navigate('/my-records');
    }catch(err){ toast(err.message,'err'); btn.disabled=false; btn.textContent='Gửi kỷ lục'; }
  };
});

// ---------- MY RECORDS ----------
route('/my-records', async ()=>{
  if(!currentUser) return navigate('/login');
  const { data: recs } = await sb.from('records').select('*,maps(name,slug)').eq('user_id',currentUser.id).order('submitted_at',{ascending:false});
  const statusColor = {pending:'var(--gold)',approved:'var(--ok)',rejected:'var(--err)'};
  const statusLabel = {pending:'Đang chờ duyệt',approved:'Đã duyệt',rejected:'Bị từ chối'};
  layout(`<h1 class="text-xl md:text-2xl font-extrabold mb-6">Kỷ lục của tôi</h1>
    <div class="space-y-2">
      ${(recs||[]).length ? recs.map(r=>`
        <div class="card p-3 md:p-4 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2">
          <div class="min-w-0">
            <div class="font-semibold truncate">${esc(r.maps.name)}</div>
            <div class="text-xs md:text-sm text-[--tx2]">${new Date(r.submitted_at).toLocaleString('vi-VN')}</div>
            ${r.status==='rejected'&&r.rejection_reason?`<div class="text-xs md:text-sm mt-1" style="color:var(--err)">Lý do: ${esc(r.rejection_reason)}</div>`:''}
          </div>
          <div class="flex sm:flex-col items-center sm:items-end justify-between gap-2 shrink-0">
            <div class="font-mono text-sm md:text-base" style="color:var(--gold)">${msToStr(r.time_ms)}</div>
            <span class="badge" style="background:var(--bg2);color:${statusColor[r.status]}">${statusLabel[r.status]}</span>
          </div>
        </div>`).join('') : emptyState('Bạn chưa gửi kỷ lục nào.')}
    </div>`);
});

// ---------- ADMIN: settings ----------
route('/admin/settings', async ()=>{
  if(currentProfile?.role!=='admin'){ toast('Bạn không có quyền truy cập.','err'); return navigate('/'); }
  const { data: cfg } = await sb.from('clan_settings').select('*').eq('id',true).single();
  layout(`<div class="max-w-lg mx-auto card p-5 md:p-8">
    <h1 class="text-xl md:text-2xl font-extrabold mb-6">Cài đặt clan</h1>
    <form id="f-settings" class="space-y-4">
      <div><label class="text-sm text-[--tx2]">Tên clan</label>
        <input name="clan_name" value="${esc(cfg.clan_name)}" required class="w-full mt-1"></div>
      <div><label class="text-sm text-[--tx2]">Slogan</label>
        <input name="slogan" value="${esc(cfg.slogan)}" class="w-full mt-1"></div>
      <div><label class="text-sm text-[--tx2]">Logo hiện tại</label><br>
        ${cfg.logo_url?`<img src="${esc(cfg.logo_url)}" class="h-16 w-16 rounded object-cover my-2">`:'<p class="text-sm text-[--tx2] my-2">Chưa có logo</p>'}
        <input type="file" name="logo_file" accept="image/png,image/jpeg,image/webp" class="w-full text-sm">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-sm text-[--tx2]">Màu chính</label>
          <input type="color" name="color_primary" value="${esc(cfg.color_primary)}" class="w-full h-10 mt-1"></div>
        <div><label class="text-sm text-[--tx2]">Màu nhấn</label>
          <input type="color" name="color_accent" value="${esc(cfg.color_accent)}" class="w-full h-10 mt-1"></div>
      </div>
      <button class="btn-p w-full" type="submit">Lưu cài đặt</button>
    </form>
  </div>`);
  document.getElementById('f-settings').onsubmit = async (e)=>{
    e.preventDefault();
    const btn=e.target.querySelector('button'); btn.disabled=true; btn.textContent='Đang lưu...';
    try{
      const fd = new FormData(e.target);
      const update = {
        clan_name: fd.get('clan_name'), slogan: fd.get('slogan'),
        color_primary: fd.get('color_primary'), color_accent: fd.get('color_accent'),
        updated_by: currentUser.id
      };
      const logoFile = fd.get('logo_file');
      if(logoFile && logoFile.size){
        const { url } = await uploadImage('branding', logoFile, 'logo');
        update.logo_url = url;
      }
      const { error } = await sb.from('clan_settings').update(update).eq('id',true);
      if(error) throw error;
      await loadClanSettings();
      toast('Đã lưu cài đặt.');
      navigate('/');
    }catch(err){ toast(err.message,'err'); btn.disabled=false; btn.textContent='Lưu cài đặt'; }
  };
});

// ---------- ADMIN: members ----------
route('/admin/members', async ()=>{
  if(!(currentProfile?.role==='admin')){ toast('Chỉ admin mới có quyền.','err'); return navigate('/'); }
  const { data: members } = await sb.from('profiles').select('*').order('joined_at');
  layout(`<h1 class="text-xl md:text-2xl font-extrabold mb-6">Quản lý thành viên</h1>
    <div class="card overflow-hidden">
      <table class="resp-table w-full text-sm">
        <thead><tr class="text-left text-[--tx2] border-b" style="border-color:var(--bd)">
          <th class="p-3">Thành viên</th><th class="p-3">Vai trò</th><th class="p-3">Trạng thái</th><th class="p-3"></th>
        </tr></thead>
        <tbody id="member-rows">
          ${members.map(m=>memberRow(m)).join('')}
        </tbody>
      </table>
    </div>`);
  document.querySelectorAll('.role-select').forEach(sel=>{
    sel.onchange = async ()=>{
      const { error } = await sb.from('profiles').update({ role: sel.value }).eq('id', sel.dataset.uid);
      if(error) return toast(error.message,'err');
      toast('Đã cập nhật vai trò.');
    };
  });
  document.querySelectorAll('.status-toggle').forEach(btn=>{
    btn.onclick = async ()=>{
      if(btn.dataset.uid===currentUser.id) return toast('Không thể tự khóa chính mình.','err');
      const newStatus = btn.dataset.status==='active' ? 'suspended' : 'active';
      const { error } = await sb.from('profiles').update({ status:newStatus }).eq('id',btn.dataset.uid);
      if(error) return toast(error.message,'err');
      toast('Đã cập nhật trạng thái.'); resolveRoute();
    };
  });
});
function memberRow(m){
  const isSelf = currentUser && m.id===currentUser.id;
  return `<tr class="border-b" style="border-color:var(--bd)">
    <td class="p-3" data-label="Thành viên">
      <div>
        <div class="font-semibold">${esc(m.ingame_name)}</div>
        <div class="text-xs text-[--tx2]">@${esc(m.username)}</div>
      </div>
    </td>
    <td class="p-3" data-label="Vai trò">
      <select class="role-select" data-uid="${m.id}" ${isSelf?'disabled title="Không thể tự đổi vai trò"':''}>
        ${['member','moderator','admin'].map(r=>`<option value="${r}" ${m.role===r?'selected':''}>${r}</option>`).join('')}
      </select>
    </td>
    <td class="p-3" data-label="Trạng thái">
      <span class="badge" style="background:var(--bg2);color:${m.status==='active'?'var(--ok)':'var(--err)'}">${m.status==='active'?'Hoạt động':'Đã khóa'}</span>
    </td>
    <td class="p-3">
      <button class="status-toggle btn-s text-xs" data-uid="${m.id}" data-status="${m.status}" ${isSelf?'disabled':''}>
        ${m.status==='active'?'Khóa':'Mở khóa'}
      </button>
    </td>
  </tr>`;
}

// ---------- init ----------
(async function init(){
  await loadClanSettings();
  await loadSession();
  sb.auth.onAuthStateChange(async ()=>{ await loadSession(); resolveRoute(); });
  await resolveRoute();
})();
</script>
</body>
