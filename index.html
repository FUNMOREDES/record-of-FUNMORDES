// ---------- helpers thời gian: xem lib/utils/format-time.ts ở đợt trước ----------
function msToStr(ms){
  if(!Number.isInteger(ms)||ms<0) return '--:--.---';
  const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000), mm=ms%1000;
  const p=(n,l)=>String(n).padStart(l,'0');
  return `${p(m,2)}:${p(s,2)}.${p(mm,3)}`;
}
function parseTimeStr(str){
  const m = str.trim().match(/^(\d{1,3}):([0-5]\d)\.(\d{1,3})$/);
  if(!m) throw new Error('Định dạng phải là MM:SS.mmm, ví dụ 01:25.350');
  const minutes=+m[1], seconds=+m[2], millis=+m[3].padEnd(3,'0');
  const total = minutes*60000+seconds*1000+millis;
  if(total<=0 || total>30*60000) throw new Error('Thời gian không hợp lệ.');
  return total;
}
function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, type='ok'){
  const el=document.createElement('div');
  el.className='fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl text-sm font-medium shadow-lg';
  el.style.background = type==='ok' ? 'var(--ok)' : 'var(--err)';
  el.style.color='#0a0a0a';
  el.textContent=msg;
  document.body.appendChild(el);

}
function stars(n){ return '★'.repeat(n) + '☆'.repeat(7-n); }

// bỏ dấu tiếng Việt + chuẩn hóa thành slug: "Đường Đua Bí Ẩn" -> "duong-dua-bi-an"
function slugify(str){
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/đ/gi, d => d==='đ'?'d':'D')
    .toLowerCase().trim()
    .replace(/[^a-z0-9\s-]/g,'')
    .replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
}

// ---------- Storage: upload ảnh thật lên Supabase Storage ----------
const MAX_UPLOAD_MB = 10;
const ALLOWED_TYPES = ['image/png','image/jpeg','image/jpg','image/webp'];
async function uploadImage(bucket, file, pathPrefix){
  if(!ALLOWED_TYPES.includes(file.type)) throw new Error('Chỉ chấp nhận ảnh PNG, JPG hoặc WEBP.');
  if(file.size > MAX_UPLOAD_MB*1024*1024) throw new Error(`Ảnh vượt quá ${MAX_UPLOAD_MB}MB.`);
  const ext = file.name.split('.').pop();
  const path = `${pathPrefix}/${crypto.randomUUID()}.${ext}`;
  const { error } = await sb.storage.from(bucket).upload(path, file, { upsert:false });
  if(error) throw new Error('Lỗi tải ảnh lên: '+error.message);
  if(bucket==='evidence'){
    // bucket private -> lấy signed URL (7 ngày) để lưu tham chiếu xem lại được
    const { data, error:e2 } = await sb.storage.from(bucket).createSignedUrl(path, 60*60*24*7);
    if(e2) throw e2;
    return { path, url: data.signedUrl };
  }
  const { data } = sb.storage.from(bucket).getPublicUrl(path);
  return { path, url: data.publicUrl };
}
function filePreview(inputEl, imgEl){
  inputEl.addEventListener('change', ()=>{
    const f = inputEl.files[0];
    if(!f) return imgEl.classList.add('hidden');
    imgEl.src = URL.createObjectURL(f);
    imgEl.classList.remove('hidden');
  });
}

// ---------- router ảo (hash-based) ----------
const routes = {};
function route(pattern, handler){ routes[pattern]=handler; }
function navigate(hash){ window.location.hash = hash; }
async function resolveRoute(){
  const hash = window.location.hash.slice(1) || '/';
  for(const pattern in routes){
    const keys=[]; const re = new RegExp('^'+pattern.replace(/:[^/]+/g,m=>{keys.push(m.slice(1));return '([^/]+)';})+'$');
    const m = hash.match(re);
    if(m){
      const params={}; keys.forEach((k,i)=>params[k]=decodeURIComponent(m[i+1]));
      app.innerHTML = '<div class="p-10 text-center text-[--tx2]">Đang tải...</div>';
      try{ await handler_wrap(routes[pattern], params); }
      catch(e){ app.innerHTML = `<div class="p-10 text-center text-[--err]">Lỗi: ${esc(e.message)}</div>`; }
      return;
    }
  }
  render404();
}
async function handler_wrap(fn, params){ await fn(params); }
window.addEventListener('hashchange', resolveRoute);

async function renderMaps(difficulty){
  let q = sb.from('maps').select('*').eq('is_active',true).order('sort_order');
  if(difficulty) q = q.eq('difficulty', difficulty);
  const { data: maps, error } = await q;
  if(error) throw error;

  // đếm REC đã duyệt + thời gian nhanh nhất mỗi map (dùng view map_rankings)
  const ids = maps.map(m=>m.id);
  let bestByMap = {};
  if(ids.length){
    const { data: ranks } = await sb.from('map_rankings').select('map_id,time_ms,rank,profiles(ingame_name)').in('map_id',ids).eq('rank',1);
    (ranks||[]).forEach(r=> bestByMap[r.map_id]=r);
  }

  const filters=[null,2,3,4,5,6,7];
  layout(`
    <div class="flex flex-wrap gap-2 mb-6">
      ${filters.map(f=>`<a onclick="navigate('${f?'/maps/difficulty/'+f:'/maps'}')"
        class="btn-s text-sm" style="${(difficulty===f)?'background:var(--blue);color:#0a0a0a;border-color:var(--blue)':''}">
        ${f?f+'⭐':'Tất cả'}</a>`).join('')}
    </div>
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
      ${maps.length ? maps.map(m=>mapCard(m,bestByMap[m.id])).join('') : emptyState('Không có map nào ở mức độ khó này.')}
    </div>`);
}

          </tr>`).join('') || `<tr><td class="p-6 text-center text-[--tx2]" colspan="3">Chưa có kỷ lục nào được duyệt cho map này.</td></tr>`}
        </tbody>
      </table>
    </div>`);
});
function podium(r,pos){
  const medal=['🥇','🥈','🥉'][pos-1];
  return `<div class="card p-5 text-center" style="order:${pos===1?0:pos}">
    <div class="text-3xl mb-1">${medal}</div>
    <div class="font-bold">${esc(r.profiles.ingame_name)}</div>
    <div class="font-mono text-sm" style="color:var(--gold)">${msToStr(r.time_ms)}</div>
  </div>`;
}

route('/submit-record', async ()=>{
  if(!currentUser){ toast('Vui lòng đăng nhập trước.','err'); return navigate('/login'); }
  const { data: maps } = await sb.from('maps').select('id,name,difficulty').eq('is_active',true).order('name');
  layout(`
    <div class="max-w-lg mx-auto card p-8">
      <h1 class="text-2xl font-extrabold mb-1">Gửi kỷ lục</h1>
      <p class="text-sm text-[--tx2] mb-6">Gửi với tư cách: <b>${esc(currentProfile?.ingame_name)}</b></p>
      <form id="f-rec" class="space-y-4">
        <div><label class="text-sm text-[--tx2]">Map</label>
          <select required name="map_id" class="w-full mt-1">
            <option value="">-- Chọn map --</option>
            ${maps.map(m=>`<option value="${m.id}">${esc(m.name)} (${m.difficulty}⭐)</option>`).join('')}
          </select>
        </div>
        <div><label class="text-sm text-[--tx2]">Thời gian (MM:SS.mmm)</label>
          <input required name="time_str" placeholder="01:25.350" class="w-full mt-1 font-mono">
        </div>
        <div><label class="text-sm text-[--tx2]">Ảnh bằng chứng (PNG/JPG/WEBP, tối đa ${MAX_UPLOAD_MB}MB)</label>
          <input required type="file" name="evidence_file" id="evidence_file" accept="image/png,image/jpeg,image/webp" class="w-full mt-1">
          <img id="evidence_preview" class="hidden mt-2 max-h-48 rounded-lg border" style="border-color:var(--bd)">
        </div>
        <div><label class="text-sm text-[--tx2]">Ghi chú (không bắt buộc)</label>
          <textarea name="note" maxlength="500" class="w-full mt-1" rows="2"></textarea>
        </div>
        <label class="flex items-start gap-2 text-sm text-[--tx2]">
          <input required type="checkbox" name="confirm" class="mt-1">
          Tôi xác nhận thời gian và bằng chứng cung cấp là chính xác.
        </label>
        <button class="btn-p w-full" type="submit">Gửi kỷ lục</button>
      </form>
    </div>`);
  filePreview(document.getElementById('evidence_file'), document.getElementById('evidence_preview'));
  document.getElementById('f-rec').onsubmit = async (e)=>{
    e.preventDefault();
    const btn=e.target.querySelector('button'); btn.disabled=true;
    try{
      const fd = new FormData(e.target);
      const time_ms = parseTimeStr(fd.get('time_str'));
      const file = fd.get('evidence_file');
      if(!file || !file.size) throw new Error('Vui lòng chọn ảnh bằng chứng.');
      btn.textContent='Đang tải ảnh...';
      // lưu theo thư mục riêng của từng user -> khớp policy "evidence_insert_own"
      const { path } = await uploadImage('evidence', file, currentUser.id);
      btn.textContent='Đang gửi...';
      const { error } = await sb.from('records').insert({
        user_id: currentUser.id,
        map_id: fd.get('map_id'),
        time_ms,
        evidence_url: path, // lưu path trong bucket; URL xem lại được tạo signed URL khi cần
        note: fd.get('note') || null,
        status: 'pending'
      });
      if(error) throw error;
      toast('Gửi kỷ lục thành công! Đang chờ duyệt.');
      navigate('/my-records');
    }catch(err){ toast(err.message,'err'); btn.disabled=false; btn.textContent='Gửi kỷ lục'; }
  };
});

// ---------- HỒ SƠ CÁ NHÂN: đổi tên ingame + đổi mật khẩu ----------
route('/profile', async ()=>{
  if(!currentUser) return navigate('/login');
  layout(`
    <div class="max-w-md mx-auto space-y-6">
      <div class="card p-8">
        <h1 class="text-2xl font-extrabold mb-1">Hồ sơ của tôi</h1>
        <p class="text-sm text-[--tx2] mb-6">Username: <b>@${esc(currentProfile.username)}</b> <span class="text-xs">(không thể đổi)</span></p>
        <form id="f-name" class="space-y-4">
          <div><label class="text-sm text-[--tx2]">Tên ingame</label>
            <input required name="ingame_name" value="${esc(currentProfile.ingame_name)}" class="w-full mt-1"></div>
          <button class="btn-p w-full" type="submit">Lưu tên</button>
        </form>
      </div>
      <div class="card p-8">
        <h2 class="text-xl font-extrabold mb-4">Đổi mật khẩu</h2>
        <form id="f-pass" class="space-y-4">
          <div><label class="text-sm text-[--tx2]">Mật khẩu mới</label>
            <input required type="password" minlength="6" name="new_password" class="w-full mt-1"></div>
          <div><label class="text-sm text-[--tx2]">Nhập lại mật khẩu mới</label>
            <input required type="password" minlength="6" name="confirm_password" class="w-full mt-1"></div>
          <button class="btn-p w-full" type="submit">Đổi mật khẩu</button>
        </form>
      </div>
    </div>`);

  document.getElementById('f-name').onsubmit = async (e)=>{
    e.preventDefault();
    const btn=e.target.querySelector('button'); btn.disabled=true; btn.textContent='Đang lưu...';
    try{
      const fd = new FormData(e.target);
      const { error } = await sb.from('profiles').update({ ingame_name: fd.get('ingame_name') }).eq('id', currentUser.id);
      if(error) throw error;
      await loadSession();
      toast('Đã cập nhật tên ingame.');
    }catch(err){ toast(err.message,'err'); }
    finally{ btn.disabled=false; btn.textContent='Lưu tên'; }
  };

  document.getElementById('f-pass').onsubmit = async (e)=>{
    e.preventDefault();
    const btn=e.target.querySelector('button'); btn.disabled=true; btn.textContent='Đang đổi...';
    try{
      const fd = new FormData(e.target);
      const p1 = fd.get('new_password'), p2 = fd.get('confirm_password');
      if(p1 !== p2) throw new Error('Mật khẩu nhập lại không khớp.');
      const { error } = await sb.auth.updateUser({ password: p1 });
      if(error) throw error;
      toast('Đã đổi mật khẩu thành công.');
      e.target.reset();
    }catch(err){ toast(err.message,'err'); }
    finally{ btn.disabled=false; btn.textContent='Đổi mật khẩu'; }
  };
});

// ---------- REC CỦA TÔI ----------
route('/my-records', async ()=>{
  if(!currentUser) return navigate('/login');
  const { data: recs } = await sb.from('records').select('*,maps(name,slug)').eq('user_id',currentUser.id).order('submitted_at',{ascending:false});
  const statusColor = {pending:'var(--gold)',approved:'var(--ok)',rejected:'var(--err)'};
  const statusLabel = {pending:'Đang chờ duyệt',approved:'Đã duyệt',rejected:'Bị từ chối'};

      ${(recs||[]).length ? recs.map(r=>`
        <div class="card p-4 flex justify-between items-center">
          <div>
            <div class="font-semibold">${esc(r.maps.name)}</div>
            <div class="text-sm text-[--tx2]">${new Date(r.submitted_at).toLocaleString('vi-VN')}</div>
            ${r.status==='rejected'&&r.rejection_reason?`<div class="text-sm mt-1" style="color:var(--err)">Lý do: ${esc(r.rejection_reason)}</div>`:''}

          <div class="text-right">

// ---------- ADMIN: quản lý map (thêm thủ công + ẩn/hiện/xóa) ----------
route('/admin/maps', async ()=>{
  if(!isModOrAdmin()){ toast('Bạn không có quyền truy cập.','err'); return navigate('/'); }
  const { data: maps } = await sb.from('maps').select('*').order('sort_order');
  layout(`
    <h1 class="text-2xl font-extrabold mb-6">Quản lý map</h1>
    <div class="grid lg:grid-cols-[380px_1fr] gap-6">
      <div class="card p-6 h-fit">
        <h2 class="font-bold mb-4">Thêm map mới</h2>
        <form id="f-map" class="space-y-4">
          <div><label class="text-sm text-[--tx2]">Tên map</label>
            <input required name="name" id="map_name" class="w-full mt-1"></div>
          <div><label class="text-sm text-[--tx2]">Slug (tự sinh, có thể sửa)</label>
            <input required name="slug" id="map_slug" class="w-full mt-1 font-mono text-sm"
              pattern="^[a-z0-9]+(-[a-z0-9]+)*$" title="Chỉ chữ thường, số, gạch ngang"></div>
          <div><label class="text-sm text-[--tx2]">Độ khó</label>
            <select required name="difficulty" class="w-full mt-1">
              ${[2,3,4,5,6,7].map(n=>`<option value="${n}">${n}⭐</option>`).join('')}
            </select></div>
          <div><label class="text-sm text-[--tx2]">Mô tả</label>
            <textarea name="description" rows="2" class="w-full mt-1"></textarea></div>
          <div><label class="text-sm text-[--tx2]">Ảnh thumbnail (PNG/JPG/WEBP, tối đa ${MAX_UPLOAD_MB}MB)</label>
            <input type="file" name="thumbnail_file" id="thumb_file" accept="image/png,image/jpeg,image/webp" class="w-full mt-1">
            <img id="thumb_preview" class="hidden mt-2 w-full aspect-video object-cover rounded-lg border" style="border-color:var(--bd)">
          </div>
          <label class="flex items-center gap-2 text-sm text-[--tx2]">
            <input type="checkbox" name="is_active" checked> Hiển thị công khai ngay
          </label>
          <button class="btn-p w-full" type="submit">Thêm map</button>
        </form>
      </div>
      <div class="card overflow-hidden h-fit">
        <table class="w-full text-sm">
          <thead><tr class="text-left text-[--tx2] border-b" style="border-color:var(--bd)">
            <th class="p-3">Map</th><th class="p-3">Độ khó</th><th class="p-3">Trạng thái</th><th class="p-3"></th>
          </tr></thead>
          <tbody>
            ${maps.map(m=>`<tr class="border-b" style="border-color:var(--bd)">
              <td class="p-3 flex items-center gap-2">
                ${m.thumbnail_url?`<img src="${esc(m.thumbnail_url)}" class="w-14 h-8 object-cover rounded">`:`<div class="w-14 h-8 rounded flex items-center justify-center" style="background:var(--bg2)">🏁</div>`}
                <span class="font-semibold">${esc(m.name)}</span>
              </td>
              <td class="p-3">${m.difficulty}⭐</td>
              <td class="p-3"><span class="badge" style="background:var(--bg2);color:${m.is_active?'var(--ok)':'var(--tx2)'}">${m.is_active?'Đang hiện':'Đã ẩn'}</span></td>
              <td class="p-3 text-right whitespace-nowrap">
                <button class="btn-s text-xs toggle-active" data-id="${m.id}" data-active="${m.is_active}">${m.is_active?'Ẩn':'Hiện'}</button>
                <button class="btn-s text-xs delete-map" data-id="${m.id}" style="color:var(--err)">Xóa</button>
              </td>
            </tr>`).join('') || `<tr><td class="p-6 text-center text-[--tx2]" colspan="4">Chưa có map nào.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>`);

  document.getElementById('map_name').addEventListener('input', (e)=>{
    document.getElementById('map_slug').value = slugify(e.target.value);
  });
  filePreview(document.getElementById('thumb_file'), document.getElementById('thumb_preview'));

  document.getElementById('f-map').onsubmit = async (e)=>{
    e.preventDefault();
    const btn = e.target.querySelector('button'); btn.disabled=true; btn.textContent='Đang lưu...';
    try{
      const fd = new FormData(e.target);
      const insert = {
        name: fd.get('name'),
        slug: fd.get('slug'),
        difficulty: +fd.get('difficulty'),
        description: fd.get('description') || null,
        is_active: fd.get('is_active')==='on',
        created_by: currentUser.id
      };
      const file = fd.get('thumbnail_file');
      if(file && file.size){
        btn.textContent='Đang tải ảnh...';
        const { url } = await uploadImage('map-thumbnails', file, insert.slug);
        insert.thumbnail_url = url;
      }
      btn.textContent='Đang lưu...';
      const { error } = await sb.from('maps').insert(insert);
      if(error) throw error;
      toast('Đã thêm map.');
      navigate('/admin/maps'); resolveRoute();
    }catch(err){
      const msg = err.message.includes('duplicate key') ? 'Slug này đã tồn tại, hãy đổi slug khác.' : err.message;
      toast(msg,'err'); btn.disabled=false; btn.textContent='Thêm map';
    }
  };

  document.querySelectorAll('.toggle-active').forEach(btn=>{
    btn.onclick = async ()=>{
      const { error } = await sb.from('maps').update({ is_active: btn.dataset.active!=='true' }).eq('id',btn.dataset.id);
      if(error) return toast(error.message,'err');
      resolveRoute();
    };
  });
  document.querySelectorAll('.delete-map').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm('Xóa map này? Không thể hoàn tác.')) return;
      const { error } = await sb.from('maps').delete().eq('id',btn.dataset.id);
      if(error){
        // ràng buộc "records references maps ... on delete restrict" trong migration
        // sẽ chặn xóa nếu map đã có REC — hiển thị lý do dễ hiểu thay vì lỗi SQL thô.
        return toast('Không xóa được: map này đã có kỷ lục gửi lên. Hãy ẩn map thay vì xóa.','err');
      }
      toast('Đã xóa map.'); resolveRoute();
    };
  });
});

route('/admin/members', async ()=>{
  if(!(currentProfile?.role==='admin')){ toast('Chỉ admin mới có quyền đổi vai trò thành viên.','err'); return navigate('/'); }
  const { data: members } = await sb.from('profiles').select('*').order('joined_at');
  layout(`<h1 class="text-2xl font-extrabold mb-6">Quản lý thành viên</h1>
    <div class="card overflow-hidden">
      <table class="w-full text-sm">
        <thead><tr class="text-left text-[--tx2] border-b" style="border-color:var(--bd)">
          <th class="p-3">Thành viên</th><th class="p-3">Vai trò</th><th class="p-3">Trạng thái</th><th class="p-3"></th>
        </tr></thead>
        <tbody id="member-rows">
          ${members.map(m=>memberRow(m)).join('')}
        </tbody>
      </table>
    </div>`);
  document.querySelectorAll('.role-select').forEach(sel=>{
    sel.onchange = async ()=>{
      // select đã bị disabled cho chính mình ở trên; RLS (profiles_update_own_limited)
      // cũng chặn lại ở tầng database nếu ai đó cố bypass UI.
      const { error } = await sb.from('profiles').update({ role: sel.value }).eq('id', sel.dataset.uid);
      if(error) return toast(error.message,'err');
      toast('Đã cập nhật vai trò.');
    };
  });
  document.querySelectorAll('.status-toggle').forEach(btn=>{
    btn.onclick = async ()=>{
      if(btn.dataset.uid===currentUser.id) return toast('Không thể tự khóa chính mình.','err');
      const newStatus = btn.dataset.status==='active' ? 'suspended' : 'active';
      const { error } = await sb.from('profiles').update({ status:newStatus }).eq('id',btn.dataset.uid);
      if(error) return toast(error.message,'err');
      toast('Đã cập nhật trạng thái.'); resolveRoute();
    };
  });
});
function memberRow(m){
  const isSelf = currentUser && m.id===currentUser.id;
  return `<tr class="border-b" style="border-color:var(--bd)">
    <td class="p-3">
      <div class="font-semibold">${esc(m.ingame_name)}</div>
      <div class="text-xs text-[--tx2]">@${esc(m.username)}</div>
    </td>
    <td class="p-3">
      <select class="role-select" data-uid="${m.id}" ${isSelf?'disabled title="Không thể tự đổi vai trò"':''}>
        ${['member','moderator','admin'].map(r=>`<option value="${r}" ${m.role===r?'selected':''}>${r}</option>`).join('')}
      </select>
    </td>
    <td class="p-3">
      <span class="badge" style="background:var(--bg2);color:${m.status==='active'?'var(--ok)':'var(--err)'}">${m.status==='active'?'Hoạt động':'Đã khóa'}</span>
    </td>
    <td class="p-3">
      <button class="status-toggle btn-s text-xs" data-uid="${m.id}" data-status="${m.status}" ${isSelf?'disabled':''}>
        ${m.status==='active'?'Khóa':'Mở khóa'}
      </button>
    </td>
  </tr>`;
}
